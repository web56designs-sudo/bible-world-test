name: Build and deploy Bible World web test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and patch test source
        run: |
          cat source.part00 source.part01 source.part02 source.part03 source.part04 source.part05 | base64 -d > source.zip
          unzip -o source.zip || true
          test -s project.godot
          test -s export_presets.cfg
          test -s scenes/main.tscn
          test -s scripts/main.gd
          test -s scripts/world_scene.gd
          test -s scripts/rules.gd
          test -s scripts/save_service.gd
          test -s scripts/content_service.gd
          test -s content/questions.json
          test -s content/worlds.json
          find scripts -name '*.uid' -delete
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/main.gd')
          s = p.read_text()
          old = '\t\t\trender_play() if rules.state != "feedback" else render_feedback()'
          new = '\t\t\tif rules.state != "feedback":\n\t\t\t\trender_play()\n\t\t\telse:\n\t\t\t\trender_feedback()'
          if old not in s:
              raise SystemExit('Expected resume conditional not found')
          p.write_text(s.replace(old, new))
          PY
          mkdir -p builds/web

      - name: Install Godot 4.5.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit

      - name: Export Web build
        run: godot --headless --export-release Web builds/web/index.html

      - name: Disable Jekyll
        run: touch builds/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
