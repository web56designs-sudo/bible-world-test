name: Build Bible World 3D prototype

on:
  push:
    branches: [prototype-3d-edt-build]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bible-world-3d-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype3d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply prototype compatibility patch
        run: sed -i 's/OctahedronMesh.new()/PrismMesh.new()/g' scripts/main.gd

      - name: Install Godot 4.5.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true

      - name: Import and validate scripts
        run: |
          set -o pipefail
          godot --headless --editor --quit 2>&1 | tee godot-import.log
          if grep -q "SCRIPT ERROR" godot-import.log; then exit 1; fi
          if grep -q "Parse Error" godot-import.log; then exit 1; fi

      - name: Export Web prototype
        run: |
          mkdir -p builds/web
          set -o pipefail
          godot --headless --export-release Web builds/web/index.html 2>&1 | tee godot-export.log
          if grep -q "SCRIPT ERROR" godot-export.log; then exit 1; fi
          if grep -q "Parse Error" godot-export.log; then exit 1; fi
          test -s builds/web/index.html
          touch builds/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype3d/builds/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy 3D prototype
        id: deployment
        uses: actions/deploy-pages@v4
